name: CI
on:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-media-refs.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/smoke.spec.ts tests/content.spec.ts tests/one-headline.spec.ts tests/chapters-media.spec.ts tests/weight.spec.ts tests/a11y.spec.ts
      - run: npx lhci autorun
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
